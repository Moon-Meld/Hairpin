<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>

    <!-- Brand Accent Gradient: Gold to Coral -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#f5d08a"/>
      <stop offset="50%" stop-color="#e8a87c"/>
      <stop offset="100%" stop-color="#d4776b"/>
    </linearGradient>

    <!-- Subtle Bevel Gradient -->
    <linearGradient id="bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="pinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.94  0 1 0 0 0.76  0 0 1 0 0.50  0 0 0 0.45 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif; }
    .title { font-size: 56px; font-weight: 800; letter-spacing: -1.5px; fill: #ffffff; }
    .tagline { font-size: 20px; font-weight: 400; fill: #94a3b8; letter-spacing: -0.3px; }
    .badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; fill: #f0c27f; }
  </style>

  <!-- Canvas Background -->
  <rect width="1280" height="440" fill="url(#bg)"/>

  <!-- Radial Glow Elements in Background -->
  <circle cx="280" cy="220" r="180" fill="#f0c27f" opacity="0.08" filter="url(#ambientGlow)"/>
  <circle cx="1020" cy="180" r="220" fill="#38bdf8" opacity="0.06" filter="url(#ambientGlow)"/>

  <!-- Left Column: Branding & Tagline -->
  <g transform="translate(100, 110)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="176" height="28" rx="14" fill="#f0c27f" fill-opacity="0.1" stroke="#f0c27f" stroke-opacity="0.25" stroke-width="1"/>
    <text x="88" y="18" text-anchor="middle" class="font-sans badge">macOS Menu Bar Agent</text>

    <!-- Main Title with Gradient Word -->
    <text x="0" y="82" class="font-sans title">
      Hairpin
      <tspan fill="url(#brand)">✦</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="124" class="font-sans tagline">Tame your menu bar. Reclaim the notch.</text>
    <text x="0" y="152" class="font-sans" font-size="14" fill="#64748b">
      Non-invasive dual-status spacer engine • Dynamic Island drawer • Zero-permission privacy
    </text>

    <!-- Quick Spec Tags -->
    <g transform="translate(0, 185)" class="font-sans" font-size="12" fill="#cbd5e1">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="108" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="54" y="19" text-anchor="middle">macOS 13+</text>

      <!-- Tag 2 -->
      <rect x="118" y="0" width="112" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="174" y="19" text-anchor="middle">Swift 6 &amp; SPM</text>

      <!-- Tag 3 -->
      <rect x="240" y="0" width="104" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="292" y="19" text-anchor="middle">SIP Untouched</text>

      <!-- Tag 4 -->
      <rect x="354" y="0" width="126" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="417" y="19" text-anchor="middle">Zero Telemetry</text>
    </g>
  </g>

  <!-- Right Column: Visual Product Graphic (MacBook Screen & Floating Dynamic Island) -->
  <g transform="translate(740, 60)">
    <!-- Dark Glass Display Mockup Surface -->
    <rect x="0" y="0" width="440" height="320" rx="20" fill="#0b0f17" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="320" rx="20" fill="url(#bevel)"/>

    <!-- Simulated Top Menu Bar on the screen -->
    <rect x="1" y="1" width="438" height="38" rx="19" fill="#131b29" fill-opacity="0.7"/>

    <!-- Left side menu items (File Edit View...) -->
    <g transform="translate(24, 24)" class="font-sans" font-size="11" fill="#94a3b8">
      <circle cx="4" cy="-4" r="5" fill="#f8fafc"/>
      <text x="18" y="0" font-weight="600" fill="#f8fafc">Finder</text>
      <text x="64" y="0">File</text>
      <text x="96" y="0">Edit</text>
    </g>

    <!-- Center Notch Housing -->
    <path d="M 175 0 
             L 182 0 
             A 4 4 0 0 1 186 4 
             L 186 16 
             A 6 6 0 0 0 192 22 
             L 248 22 
             A 6 6 0 0 0 254 16 
             L 254 4 
             A 4 4 0 0 1 258 0 
             L 265 0 Z" fill="#000000"/>
    <circle cx="220" cy="11" r="3" fill="#0284c7" opacity="0.8"/>

    <!-- Right Menu Bar Status Items -->
    <g transform="translate(276, 24)" class="font-sans" font-size="11" fill="#cbd5e1">
      <!-- Hidden Icons (faint) -->
      <circle cx="10" cy="-4" r="4.5" fill="#475569" opacity="0.4"/>
      <rect x="24" y="-8" width="9" height="9" rx="2" fill="#475569" opacity="0.4"/>
      
      <!-- Hairpin Separator Bar -->
      <rect x="42" y="-12" width="14" height="16" rx="3" fill="#f0c27f" fill-opacity="0.2"/>
      <text x="49" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#f0c27f">|</text>

      <!-- Visible Items -->
      <circle cx="70" cy="-4" r="4.5" fill="#94a3b8"/>
      <rect x="84" y="-8" width="12" height="8" rx="2" fill="#22c55e"/>
      <!-- Hairpin Toggle Button -->
      <rect x="106" y="-12" width="18" height="16" rx="4" fill="url(#brand)"/>
      <path d="M111 -5 L119 -5 M111 -2 L119 -2 M111 1 L116 1" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
      <text x="134" y="0" font-size="9" font-weight="600" fill="#f8fafc">9:41</text>
    </g>

    <!-- Floating Dynamic Island Panel (Below Notch) -->
    <g transform="translate(130, 48)">
      <!-- Outer Drop Shadow -->
      <rect x="0" y="0" width="180" height="42" rx="13" fill="#000000" opacity="0.5" transform="translate(0, 6)"/>
      <!-- Pill Container -->
      <rect x="0" y="0" width="180" height="42" rx="13" fill="#161f2e" stroke="url(#brand)" stroke-width="1" stroke-opacity="0.5"/>
      <!-- Indicator Dot -->
      <circle cx="18" cy="21" r="4" fill="#f97316"/>
      <circle cx="18" cy="21" r="8" fill="#f97316" opacity="0.25"/>
      <!-- Text -->
      <text x="32" y="18" class="font-sans" font-size="10" font-weight="600" fill="#f8fafc">Behind Notch</text>
      <text x="32" y="30" class="font-sans" font-size="8" fill="#94a3b8">3 items hidden</text>
      <!-- Show All Pill -->
      <rect x="122" y="10" width="48" height="22" rx="11" fill="url(#brand)"/>
      <text x="146" y="24" text-anchor="middle" class="font-sans" font-size="8.5" font-weight="700" fill="#0f172a">Show</text>
    </g>

    <!-- Large 3D Hairpin Emblem Overlay -->
    <g transform="translate(160, 130)" filter="url(#pinGlow)">
      <!-- Bobby pin geometric path -->
      <path d="M 30 110 
               L 85 45 
               A 16 16 0 0 1 108 45 
               L 115 52 
               A 16 16 0 0 1 115 75 
               L 65 135 
               A 12 12 0 0 1 48 135 
               L 30 117 
               A 6 6 0 0 1 30 110 Z" 
            fill="none" 
            stroke="url(#brand)" 
            stroke-width="12" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      <path d="M 52 90 L 98 40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Status caption -->
    <text x="220" y="295" text-anchor="middle" class="font-sans" font-size="11" fill="#64748b">
      Automatic overflow sensing • No screen recording required
    </text>
  </g>
</svg>
